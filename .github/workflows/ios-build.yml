# Compila la app en un Mac de GitHub con cada push. Sin firma: valida que el
# proyecto compila y deja la app de simulador como artefacto. La firma y la
# subida a TestFlight se agregan cuando exista la cuenta de Apple Developer.
name: Compilar iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar para simulador
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ventas365.xcodeproj \
            -scheme Ventas365 \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      - name: Empaquetar la app de simulador
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/Ventas365-simulador.zip" Ventas365.app

      - name: Guardar la app de simulador
        uses: actions/upload-artifact@v4
        with:
          name: Ventas365-simulador
          path: Ventas365-simulador.zip
          retention-days: 14

      - name: Guardar el registro si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
